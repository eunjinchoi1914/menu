<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 점심 뭐 먹지? - 점심메뉴 돌림판</title>
  
  <!-- 앱 설정 파일(manifest.json) 연결 코드 -->
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --primary-color: #0d9488;
      --primary-hover: #0f766e;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      padding: 32px 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .description {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 24px;
    }

    .arrow {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid #ef4444;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: white;
      border: 4px solid var(--primary-color);
      border-radius: 50%;
      font-weight: bold;
      color: var(--primary-color);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.1s;
      z-index: 5;
    }

    .spin-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    .spin-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .result {
      font-size: 1.25rem;
      font-weight: 600;
      min-height: 2rem;
      margin-bottom: 24px;
      color: var(--primary-color);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .menu-item {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .menu-item span {
      width: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .menu-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .menu-input:focus {
      border-color: var(--primary-color);
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 4px;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>오늘 점심 뭐 먹지?</h1>
    <p class="description">칸 수를 정하고 메뉴를 적은 뒤, 돌림판을 돌려 보세요.</p>

    <div class="wheel-container">
      <div class="arrow"></div>
      <canvas id="wheel" width="280" height="280"></canvas>
      <button id="spin-btn" class="spin-btn">GO</button>
    </div>

    <div id="result" class="result">돌리기 버튼을 누르세요!</div>

    <div class="controls">
      <div class="control-group">
        <label><strong>메뉴 칸 수</strong></label>
        <div class="count-control">
          <button id="dec-btn" class="count-btn">-</button>
          <span id="count-display">6</span>
          <button id="inc-btn" class="count-btn">+</button>
        </div>
      </div>

      <div id="menu-list" class="menu-list"></div>

      <div class="option-group">
        <input type="checkbox" id="remove-option">
        <label for="remove-option">나온 메뉴는 다음 판에서 빼기</label>
      </div>
    </div>
  </div>

  <script>
    const colors = ['#f87171', '#fb923c', '#fbbf24', '#4ade80', '#38bdf8', '#818cf8', '#c084fc', '#f472b6'];
    const defaultMenus = ['김치찌개', '돈가스', '비빔밥', '짜장면', '떡볶이', '칼국수', '초밥', '햄버거'];

    let count = 6;
    let menus = [...defaultMenus.slice(0, 6)];
    let currentRotation = 0;
    let isSpinning = false;

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spin-btn');
    const resultDiv = document.getElementById('result');
    const countDisplay = document.getElementById('count-display');
    const menuListDiv = document.getElementById('menu-list');

    function drawWheel() {
      const numOptions = menus.length;
      const arcSize = (2 * Math.PI) / numOptions;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numOptions; i++) {
        const angle = i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
        ctx.lineTo(centerX, centerY);
        ctx.fill();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px -apple-system, sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.shadowBlur = 2;
        ctx.fillText(menus[i] || `메뉴 ${i+1}`, radius - 20, 5);
        ctx.restore();
      }
    }

    function renderInputs() {
      menuListDiv.innerHTML = '';
      menus.forEach((menu, index) => {
        const item = document.createElement('div');
        item.className = 'menu-item';
        item.innerHTML = `
          <span>${index + 1}.</span>
          <input type="text" class="menu-input" value="${menu}" data-index="${index}">
        `;
        menuListDiv.appendChild(item);
      });

      document.querySelectorAll('.menu-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = e.target.getAttribute('data-index');
          menus[idx] = e.target.value;
          drawWheel();
        });
      });
    }

    function updateCount(newCount) {
      if (newCount < 2 || newCount > 16) return;
      count = newCount;
      countDisplay.textContent = count;

      if (menus.length < count) {
        for (let i = menus.length; i < count; i++) {
          menus.push(defaultMenus[i] || `메뉴 ${i+1}`);
        }
      } else if (menus.length > count) {
        menus = menus.slice(0, count);
      }

      renderInputs();
      drawWheel();
    }

    document.getElementById('inc-btn').addEventListener('click', () => updateCount(count + 1));
    document.getElementById('dec-btn').addEventListener('click', () => updateCount(count - 1));

    spinBtn.addEventListener('click', () => {
      if (isSpinning || menus.length === 0) return;

      isSpinning = true;
      spinBtn.disabled = true;
      resultDiv.textContent = '두근두근...';

      const spins = 5 + Math.floor(Math.random() * 5);
      const randomDegrees = Math.floor(Math.random() * 360);
      const totalDegrees = spins * 360 + randomDegrees;
      
      currentRotation += totalDegrees;

      canvas.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.15, 1)';
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;

        const actualDegrees = currentRotation % 360;
        const numOptions = menus.length;
        const arcSizeDegrees = 360 / numOptions;

        let winningIndex = Math.floor((360 - actualDegrees + 270) % 360 / arcSizeDegrees);
        const winner = menus[winningIndex] || '선택된 메뉴';

        resultDiv.textContent = `오늘의 추천: 🎉 ${winner} 🎉`;

        if (document.getElementById('remove-option').checked && menus.length > 2) {
          menus.splice(winningIndex, 1);
          count = menus.length;
          countDisplay.textContent = count;
          renderInputs();
          drawWheel();
        }
      }, 4000);
    });

    renderInputs();
    drawWheel();
  </script>
</body>
</html>
